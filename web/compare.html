<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theology Map — Compare</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/engine/theme.css">
<style>
  [hidden] { display: none !important; }

  h1 { font-size: var(--fs-3); }
  .cmp-body-wrap { display: flex; flex-direction: column; gap: var(--s5); max-width: 900px; }

  /* ---- picker ---- */
  #picker-traditions, #picker-members { display: grid; gap: var(--s3);
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); margin-top: var(--s2); }
  .cmp-section-h { margin: var(--s4) 0 0; font: 400 var(--fs-3)/var(--lh-snug) var(--serif); letter-spacing: -.012em; }

  /* ---- results head ---- */
  #results-heading { margin: 0; font: 400 var(--fs-3)/var(--lh-snug) var(--serif); letter-spacing: -.012em; }
  #cmp-framing { margin: var(--s1) 0 0; }

  /* ---- closest tradition ---- */
  #cmp-closest { display: flex; flex-direction: column; gap: var(--s2); }
  .cmp-closest-line { margin: 0; font: var(--fs-1)/var(--lh-body) var(--serif); }

  /* ---- scorecard ---- */
  #sc-table-wrap { overflow-x: auto; border: 1px solid var(--field-line); border-radius: var(--r3); }
  .cmp-table { border-collapse: collapse; width: 100%; min-width: 560px; font: var(--fs-00)/var(--lh-ui) var(--sans);
    font-variant-numeric: tabular-nums; }
  .cmp-table th, .cmp-table td { border-bottom: 1px solid var(--line); padding: var(--s2); text-align: center; white-space: nowrap; }
  .cmp-table thead th { text-align: center; font: 600 var(--fs-000)/var(--lh-snug) var(--sans); color: var(--muted); }
  .cmp-table td.cmp-doctrine { text-align: left; font: var(--fs-0)/var(--lh-snug) var(--serif); color: var(--ink); white-space: normal; max-width: 26ch; }
  .cmp-table tr.cmp-table-group th { text-align: left; background: var(--chip); font: 600 var(--fs-000)/var(--lh-ui) var(--sans);
    color: var(--muted); padding: var(--s1) var(--s2); }
  .cmp-table td.cmp-undecided { color: var(--muted); font-style: italic; text-align: left; }
  .cmp-table td.cmp-glyph { font-size: 15px; color: var(--ink); }
  .cmp-table tfoot th, .cmp-table tfoot td { font: 600 var(--fs-00)/var(--lh-snug) var(--sans); border-top: 2px solid var(--field-line); border-bottom: none; }

  #sc-accordion-host { display: none; flex-direction: column; gap: var(--s2); }
  .cmp-acc { background: var(--panel); border: 1px solid var(--field-line); border-radius: var(--r3); padding: var(--s1) var(--s3); }
  .cmp-acc > summary { cursor: pointer; padding: var(--s2) 0; font: 600 var(--fs-0)/var(--lh-snug) var(--serif); }
  .cmp-acc-group { margin: var(--s2) 0 var(--s1); font: 600 var(--fs-000)/var(--lh-snug) var(--sans); color: var(--muted); }
  .cmp-acc-row { margin: 0 0 var(--s1); font: var(--fs-00)/var(--lh-snug) var(--serif); }
  .cmp-acc-row.cmp-grey { color: var(--muted); font-style: italic; }

  @media (max-width: 860px) {
    #sc-table-wrap { display: none; }
    #sc-accordion-host { display: flex; }
  }

  /* ---- diff groups ---- */
  #diff-groups { display: flex; flex-direction: column; gap: var(--s4); }

  /* ---- tiering ---- */
  #cmp-tiers { margin: 0 0 var(--s5); }
  .cmp-tier-lead { margin: 0 0 var(--s2); max-width: var(--measure); font: var(--fs-0)/var(--lh-body) var(--serif); color: var(--ink); }
  .cmp-tier-list { display: flex; flex-direction: column; gap: var(--s2); margin: 0; padding: 0; list-style: none; }
  .cmp-tier-item {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: var(--s2);
    padding: var(--s2); border: 1px solid var(--line); border-radius: var(--r2);
    background: var(--panel);
  }
  .cmp-tier-item .nm { font: 600 var(--fs-0)/var(--lh-snug) var(--serif); }
  /* The move is stated, never coloured good or bad: a person who tiers a
     doctrine higher than the suggestion is not thereby wrong, and neither is
     one who tiers it lower. Same weight for both directions. */
  .cmp-tier-move { font: var(--fs-00)/var(--lh-ui) var(--sans); color: var(--muted); }
  .cmp-tier-pill {
    font: 600 var(--fs-000)/1 var(--sans); color: #fff; padding: var(--s1) var(--s2);
    border-radius: var(--r-pill); white-space: nowrap;
  }
  .cmp-tier-arrow { font: var(--fs-00)/1 var(--sans); color: var(--muted); }
  .cmp-group { display: flex; flex-direction: column; gap: var(--s2); }
  .cmp-group-head { display: flex; align-items: baseline; justify-content: space-between; gap: var(--s2);
    border-left: 3px solid var(--muted); padding: var(--s1) 0 var(--s1) var(--s2); }
  .cmp-group-head h3 { margin: 0; font: 600 var(--fs-0)/var(--lh-snug) var(--sans); }
  .cmp-count { font: var(--fs-00)/var(--lh-snug) var(--sans); color: var(--muted); }

  .cmp-row { background: var(--panel); border: 1px solid var(--field-line); border-radius: var(--r3); padding: var(--s1) var(--s4); }
  .cmp-row > summary { cursor: pointer; padding: var(--s2) 0; display: flex; align-items: baseline;
    justify-content: space-between; gap: var(--s4); flex-wrap: wrap; list-style: none; }
  .cmp-row > summary::-webkit-details-marker { display: none; }
  .cmp-q { font: 600 var(--fs-1)/var(--lh-snug) var(--serif); flex: 1 1 240px; }
  .cmp-verdict { font: var(--fs-00)/var(--lh-snug) var(--sans); color: var(--muted); white-space: nowrap; }

  .cmp-body { display: grid; grid-template-columns: 1fr 1fr; gap: var(--s4); padding: var(--s1) 0 var(--s3); }
  @media (max-width: 560px) { .cmp-body { grid-template-columns: 1fr; } }
  .cmp-col { display: flex; flex-direction: column; gap: var(--s1); }
  .cmp-col p { margin: 0; }
  .cmp-row .tm-framing { margin: 0 0 var(--s2); }
  .cmp-row a { display: inline-block; margin: 0 var(--s3) var(--s2) 0; font: 600 var(--fs-00)/1 var(--sans); color: var(--ink);
    text-decoration: underline; text-decoration-color: var(--muted); text-underline-offset: 2px; }
</style>
</head>
<body class="tm-page">

<div id="tmChrome"></div>

<div class="tm-main">
  <section id="screen-picker">
    <p class="tm-note">
      A comparison sits your map next to a major tradition's or another
      member's, doctrine by doctrine. Nothing about either map changes, and no
      comparison is recorded anywhere.
    </p>

    <h2 class="cmp-section-h">A major tradition</h2>
    <div id="picker-traditions"></div>

    <h2 class="cmp-section-h">Another member</h2>
    <div id="picker-members"></div>
  </section>

  <section id="screen-results" hidden>
    <div class="cmp-body-wrap">
      <h2 id="results-heading"></h2>
      <p id="cmp-framing" hidden><span id="cmp-framing-text"></span></p>

      <div id="cmp-closest" hidden></div>

      <div id="cmp-tiers" hidden></div>

      <div id="cmp-scorecard" hidden>
        <h3 class="cmp-section-h" style="font-size:16px">The all-traditions scorecard</h3>
        <div id="sc-table-wrap"><div id="sc-table-host"></div></div>
        <div id="sc-accordion-host"></div>
      </div>

      <div id="diff-groups"></div>
    </div>
  </section>
</div>

<script src="/engine/editor-core.js"></script>
<script src="/engine/wizard-generate.js"></script>
<script src="/engine/compare-core.js"></script>
<script type="module" src="/web/compare.js"></script>
</body>
</html>
