<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theology Map — Map history</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/engine/theme.css">
<style>
  .tm-main { display: flex; flex-direction: column; gap: 20px; }
  button { padding: 9px 15px; font: 600 13px var(--sans);
           background: var(--ink); color: var(--bg);
           border: 1px solid var(--ink); border-radius: 5px; cursor: pointer; }
  #versions-section h2 { font: 600 15px/1.3 var(--serif); margin: 0 0 8px; }
  #versions-list { list-style: none; margin: 0; padding: 0; display: flex;
                   flex-direction: column; gap: 6px; }
  #versions-list li { display: flex; align-items: center; gap: 10px;
                       justify-content: space-between; padding: 8px 12px;
                       border: 1px solid var(--field-line); border-radius: 6px;
                       background: var(--panel); }
  #versions-list li span { font: 13px var(--sans); color: var(--ink); }
  #versions-list li button { padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body class="tm-page">

<div id="tmChrome"></div>

<main class="tm-main">
  <section id="versions-section">
    <h2>Earlier versions</h2>
    <p class="tm-note" id="versions-empty" hidden>
      No earlier versions yet — one is kept the first time you change a map
      you have already saved.
    </p>
    <ul id="versions-list"></ul>
  </section>
</main>

<script type="module">
import { requireUser, apiFetch } from '/web/session.js';
import { mount, relTime } from '/web/chrome.js';

mount('Map history');

const user = requireUser('Sign in to see your map history.');
if (user) {
  let map;
  try {
    map = await apiFetch('/api/map?user_id=' + encodeURIComponent(user.id));
  } catch {
    map = null;   // apiFetch showed the banner; an unknown_user already redirected.
  }
  if (map) loadVersions(user, map);
}

function bytesLabel(n) {
  return n < 1024 ? `${n} B` : `${(n / 1024).toFixed(1)} KB`;
}

async function loadVersions(user, map) {
  let versions;
  try {
    versions = await apiFetch('/api/map', {
      method: 'POST',
      body: { action: 'versions', user_id: user.id },
    });
  } catch {
    return;   // apiFetch already showed the banner
  }
  if (!versions) return;

  const list = document.getElementById('versions-list');
  list.textContent = '';

  if (versions.length === 0) {
    document.getElementById('versions-empty').hidden = false;
    return;
  }

  for (const v of versions) {
    const li = document.createElement('li');
    const label = document.createElement('span');
    let text = `${relTime(v.saved_at)} · ${bytesLabel(v.bytes)}`;
    if (v.node_count != null) {
      text += ` · ${v.node_count} belief${v.node_count === 1 ? '' : 's'}`;
    }
    label.textContent = text;
    li.appendChild(label);

    const restoreBtn = document.createElement('button');
    restoreBtn.type = 'button';
    restoreBtn.textContent = 'Restore';
    restoreBtn.addEventListener('click', () => restoreVersion(user, map, v, restoreBtn));
    li.appendChild(restoreBtn);

    list.appendChild(li);
  }
}

// The one place in the app where a confirmation earns its place (decisions.md
// / phase-8-brief.md §2) — everywhere else the house style is not to ask.
async function restoreVersion(user, map, v, btn) {
  const when = relTime(v.saved_at);
  const ok = confirm(
    `This replaces your map with the version from ${when}. Your current map `
    + `is saved first, so you can come back.`
  );
  if (!ok) return;

  btn.disabled = true;
  // expected_updated_at is captured once at page load and goes stale the moment
  // anything else saves the map, so a 409 here used to be permanent — the button
  // never got a fresh token to retry with. Re-GET immediately before restoring.
  let fresh;
  try {
    fresh = await apiFetch('/api/map?user_id=' + encodeURIComponent(user.id));
  } catch {
    btn.disabled = false;
    return;   // apiFetch already showed the banner
  }
  try {
    await apiFetch('/api/map', {
      method: 'POST',
      body: {
        action: 'restore', user_id: user.id, version_id: v.id,
        expected_updated_at: fresh.updated_at,
      },
    });
  } catch (err) {
    btn.disabled = false;
    // Still conflicting even against a token fetched seconds ago means the map
    // is actively changing elsewhere — reload so the page shows current state
    // rather than leaving a dead button with no explanation.
    if (err && err.code === 'conflict') location.reload();
    return;   // apiFetch already showed the banner, including the 409 conflict path
  }
  location.reload();
}
</script>

</body>
</html>
