<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theology Map — View</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/engine/theme.css">
<style>
  h1 { font-size: 1.4em; }
  /* The action buttons live in the header now (mount()'s actions row), which
     frees the body for the iframe — fill the rest of the viewport with it
     rather than the old fixed 70vh. */
  html, body.tm-page { height: 100%; }
  body.tm-page { display: flex; flex-direction: column; }
  .tm-main { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  iframe { width: 100%; flex: 1 1 auto; min-height: 320px; border: 1px solid var(--field-line); border-radius: 6px; }
</style>
</head>
<body class="tm-page">

<div id="tmChrome"></div>

<div class="tm-main">
  <p id="not-found" hidden>Map not found.</p>
  <!-- No allow-same-origin: a srcdoc frame inherits this page's origin, so with it a
       script smuggled into someone else's map could read our localStorage session
       (phase 2, B2). The rendered map uses no storage, cookies or same-origin API,
       so it loses nothing. The renderer escaping is the primary fix; this is depth. -->
  <iframe id="map-frame" sandbox="allow-scripts" hidden></iframe>
</div>

<script type="module">
import { getUser } from '/web/session.js';
import { mount, copyButton } from '/web/chrome.js';

function slugify(name) {
  return name
    .toLowerCase()
    .replace(/'/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

function actionBtn(text) {
  const b = document.createElement('button');
  b.className = 'tm-action-btn';
  b.textContent = text;
  b.hidden = true;
  return b;
}

// Keyed by name, not by row id: the id authorises a save, so it is not public
// (docs/hosting/phase-2-review.md, B1). Names are unique and already public, and
// this also drops the gallery round trip the old ?id= form needed for the heading.
const name = new URLSearchParams(location.search).get('name');
const exportBtn = actionBtn('Export HTML');
const copyBtn = actionBtn('Copy link');
const makeMineBtn = actionBtn('Make my own map');
mount(name ? name + "'s map" : 'Theology Map', [exportBtn, copyBtn, makeMineBtn]);
const notFoundEl = document.getElementById('not-found');
const frameEl = document.getElementById('map-frame');

const user = getUser();
makeMineBtn.hidden = false;
makeMineBtn.addEventListener('click', () => {
  location.href = user ? '/wizard' : '/#signin';
});

if (!name) {
  notFoundEl.hidden = false;
} else {
  try {
    // Plain fetch, not apiFetch: /api/render returns text/html on success, and
    // apiFetch always calls res.json(), which silently nulls out an HTML body.
    const res = await fetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const html = res.ok ? await res.text() : '';
    const isOwner = !!user && user.name.toLowerCase() === name.toLowerCase();
    // The home page's "My map" tile sends a signed-in user straight here. If
    // it's their own still-empty map, land on the launchpad instead of a dead
    // "not found" — a substring check on the rendered HTML is cheap and avoids
    // a second round trip (mbox-leaf marks a belief box; render.py emits one
    // per node).
    //
    // Deliberately gated on res.ok: /api/render 404s a map that is merely
    // UNLISTED as well as one that does not exist, and the owner can unlist
    // their own map from the home page. Redirecting on any 404 would bounce them
    // to the wizard every time they clicked "My map" — an inescapable loop off
    // their own home tile. A 404 for the owner is the unlisted case; say so instead.
    if (isOwner && res.ok && !html.includes('mbox-leaf')) {
      location.replace('/wizard');
    } else if (!res.ok) {
      notFoundEl.textContent = isOwner
        ? 'This map is unlisted, so it does not render by name. Relist it from the home page to share this link.'
        : 'Map not found.';
      notFoundEl.hidden = false;
    } else {
      const slug = slugify(name) || 'map';
      frameEl.srcdoc = html;
      frameEl.hidden = false;
      exportBtn.hidden = false;
      exportBtn.addEventListener('click', () => {
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `theology-map-${slug}.html`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Never ?id= — the row id authorises a save, so a copy-link handing out an
      // id would hand out write access (phase 2, B1). ?name= is the public key.
      copyBtn.hidden = false;
      copyButton(copyBtn, () =>
        new URL('/view?name=' + encodeURIComponent(name), location.origin).href);
    }
  } catch {
    notFoundEl.hidden = false;
  }
}
</script>

</body>
</html>
