<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theology Map — View</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/engine/theme.css">
<style>
  h1 { font-size: 1.4em; }
  .tm-main { display: flex; flex-direction: column; gap: 16px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  iframe { width: 100%; height: 70vh; border: 1px solid var(--field-line); border-radius: 6px; }
  #make-mine { font: 13px var(--sans); color: var(--muted); background: none;
               border: 1px solid var(--field-line); border-radius: 5px; padding: 6px 10px; }
</style>
</head>
<body class="tm-page">

<div id="tmChrome"></div>

<div class="tm-main">
  <p id="not-found" hidden>Map not found.</p>
  <div class="actions">
    <button id="export-btn" hidden>Export HTML</button>
    <button id="copy-btn" hidden>Copy link</button>
    <button id="make-mine" hidden>Make my own map</button>
  </div>
  <!-- No allow-same-origin: a srcdoc frame inherits this page's origin, so with it a
       script smuggled into someone else's map could read our localStorage session
       (phase 2, B2). The rendered map uses no storage, cookies or same-origin API,
       so it loses nothing. The renderer escaping is the primary fix; this is depth. -->
  <iframe id="map-frame" sandbox="allow-scripts" hidden></iframe>
</div>

<script type="module">
import { getUser } from '/web/session.js';
import { mount, copyButton } from '/web/chrome.js';

function slugify(name) {
  return name
    .toLowerCase()
    .replace(/'/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// Keyed by name, not by row id: the id authorises a save, so it is not public
// (docs/hosting/phase-2-review.md, B1). Names are unique and already public, and
// this also drops the gallery round trip the old ?id= form needed for the heading.
const name = new URLSearchParams(location.search).get('name');
mount(name ? name + "'s map" : 'Theology Map');
const notFoundEl = document.getElementById('not-found');
const frameEl = document.getElementById('map-frame');
const exportBtn = document.getElementById('export-btn');
const copyBtn = document.getElementById('copy-btn');
const makeMineBtn = document.getElementById('make-mine');

const user = getUser();
makeMineBtn.hidden = false;
makeMineBtn.addEventListener('click', () => {
  location.href = user ? '/wizard' : '/#signin';
});

if (!name) {
  notFoundEl.hidden = false;
} else {
  try {
    // Plain fetch, not apiFetch: /api/render returns text/html on success, and
    // apiFetch always calls res.json(), which silently nulls out an HTML body.
    const res = await fetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const html = res.ok ? await res.text() : '';
    const isOwner = !!user && user.name.toLowerCase() === name.toLowerCase();
    // The nav's "My map" sends a signed-in user straight here. If it's their own
    // still-empty map, land on the launchpad instead of a dead "not found" —
    // a substring check on the rendered HTML is cheap and avoids a second
    // round trip (mbox-leaf marks a belief box; render.py emits one per node).
    //
    // Deliberately gated on res.ok: /api/render 404s a map that is merely
    // UNLISTED as well as one that does not exist, and the owner can unlist
    // their own map from the editor. Redirecting on any 404 would bounce them
    // to the wizard every time they clicked "My map" — an inescapable loop off
    // their own nav. A 404 for the owner is the unlisted case; say so instead.
    if (isOwner && res.ok && !html.includes('mbox-leaf')) {
      location.replace('/wizard');
    } else if (!res.ok) {
      notFoundEl.textContent = isOwner
        ? 'This map is unlisted, so it does not render by name. Relist it from the editor to share this link.'
        : 'Map not found.';
      notFoundEl.hidden = false;
    } else {
      const slug = slugify(name) || 'map';
      frameEl.srcdoc = html;
      frameEl.hidden = false;
      exportBtn.hidden = false;
      exportBtn.addEventListener('click', () => {
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `theology-map-${slug}.html`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Never ?id= — the row id authorises a save, so a copy-link handing out an
      // id would hand out write access (phase 2, B1). ?name= is the public key.
      copyBtn.hidden = false;
      copyButton(copyBtn, () =>
        new URL('/view?name=' + encodeURIComponent(name), location.origin).href);
    }
  } catch {
    notFoundEl.hidden = false;
  }
}
</script>

</body>
</html>
