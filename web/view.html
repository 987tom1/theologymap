<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Theology Map — View</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/engine/theme.css">
<style>
  h1 { font-size: 1.4em; }
  /* The action buttons live in the header now (mount()'s actions row), which
     frees the body for the iframe — fill the rest of the viewport with it
     rather than the old fixed 70vh. */
  html, body.tm-page { height: 100%; }
  body.tm-page { display: flex; flex-direction: column; }
  .tm-main { display: flex; flex-direction: column; gap: 10px; flex: 1 1 auto; min-height: 0; }
  #tradition-note { font-size: .92em; }
  #tradition-note p { margin: 2px 0; }
  #tradition-note .standing { color: var(--muted, #555); }
  iframe { width: 100%; flex: 1 1 auto; min-height: 320px; border: 1px solid var(--field-line); border-radius: 6px; }

  /* Fullscreen: on a phone this page's chrome and the rendered map's own sticky
     header together eat about 40% of the viewport, and the map is the point of
     this page. A class, not the Fullscreen API — iOS Safari does not support
     requestFullscreen() on a non-video element, which is the platform this was
     asked for.

     It works by removing this page's chrome, NOT by taking the iframe out of
     flow. The rendered map sizes its canvas with `#mapwrap { height: calc(100vh
     - 130px) }`, and inside a `position: fixed` iframe iOS Safari does not
     resolve that 100vh against the iframe's new height — the canvas came out
     less than half the screen with dead space under it. The flex column above
     already sizes the frame correctly; fullscreen just gives it the whole
     column. Do not "simplify" this back to a fixed iframe. */
  body.tm-enlarged #tmChrome, body.tm-enlarged #tradition-note { display: none; }
  body.tm-enlarged .tm-main { padding: 0; gap: 0; max-width: none; }
  body.tm-enlarged iframe { border: 0; border-radius: 0; }
  #full-btn {
    position: fixed; z-index: 51; right: 12px;
    bottom: calc(12px + env(safe-area-inset-bottom, 0px));
    background: var(--panel); box-shadow: 0 1px 6px rgba(0,0,0,.28);
  }
</style>
</head>
<body class="tm-page">

<div id="tmChrome"></div>

<div class="tm-main">
  <div id="tradition-note" hidden>
    <p class="standing"><em>A generated summary of what this tradition confesses, not a person's map.</em></p>
    <p id="tradition-intro"></p>
    <p><a id="tradition-learn" href="/learn">Read these doctrines side by side on Learn</a></p>
  </div>
  <p id="not-found" hidden>Map not found.</p>
  <!-- No allow-same-origin: a srcdoc frame inherits this page's origin, so with it a
       script smuggled into someone else's map could read our localStorage session
       (phase 2, B2). The rendered map uses no storage, cookies or same-origin API,
       so it loses nothing. The renderer escaping is the primary fix; this is depth. -->
  <iframe id="map-frame" sandbox="allow-scripts" hidden></iframe>
</div>

<script type="module">
import { getUser } from '/web/session.js';
import { mount, copyButton } from '/web/chrome.js';

function slugify(name) {
  return name
    .toLowerCase()
    .replace(/'/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '');
}

// G3: reads the rendered page's own embedded data rather than sniffing the
// generated markup (a `mbox-leaf` class belonging to markup phase 7 was
// explicitly licensed to change) — parses the `<script id="data">` JSON
// payload every render.py output carries and counts its nodes.
function countNodes(html) {
  try {
    const doc = new DOMParser().parseFromString(html, 'text/html');
    const script = doc.getElementById('data');
    const data = JSON.parse(script.textContent);
    return Array.isArray(data.nodes) ? data.nodes.length : 0;
  } catch {
    return 0;
  }
}

function actionBtn(text) {
  const b = document.createElement('button');
  b.className = 'tm-action-btn';
  b.textContent = text;
  b.hidden = true;
  return b;
}

// Keyed by name, not by row id: the id authorises a save, so it is not public
// (docs/hosting/phase-2-review.md, B1). Names are unique and already public, and
// this also drops the gallery round trip the old ?id= form needed for the heading.
const params = new URLSearchParams(location.search);
const name = params.get('name');
// Phase 6 Task 3: same page, same render call, same export button — only the
// source of the markdown differs. A tradition map is a static file in the repo
// (content/traditions/*.md, generated by engine/build_traditions.js), so it is
// fetched here and POSTed as {markdown}; a member's map is fetched server-side
// by name. No new route, no second renderer.
const traditionId = params.get('tradition');
let tradition = null;
if (traditionId) {
  try {
    const manifest = await (await fetch('/content/traditions/manifest.json')).json();
    tradition = (manifest.traditions || []).find(t => t.id === traditionId) || null;
  } catch { tradition = null; }
}

const fullBtn = actionBtn('Fullscreen');
fullBtn.id = 'full-btn';
document.body.appendChild(fullBtn);
const exportBtn = actionBtn('Export HTML');
const copyBtn = actionBtn('Copy link');
const makeMineBtn = actionBtn('Make my own map');
const heading = tradition ? tradition.display_name
  : (traditionId ? 'Theology Map' : (name ? name + "'s map" : 'Theology Map'));
mount(heading, [exportBtn, copyBtn, makeMineBtn]);
const notFoundEl = document.getElementById('not-found');
const frameEl = document.getElementById('map-frame');

function setEnlarged(on) {
  document.body.classList.toggle('tm-enlarged', on);
  fullBtn.textContent = on ? 'Exit' : 'Fullscreen';
}
fullBtn.addEventListener('click', () =>
  setEnlarged(!document.body.classList.contains('tm-enlarged')));
// Escape is the only other way out: the frame is sandboxed without
// allow-same-origin, so a key pressed inside it never reaches this document.
addEventListener('keydown', e => { if (e.key === 'Escape') setEnlarged(false); });

const user = getUser();
// A named member map has an owner; a tradition map does not. Only the named-map
// case can be "your own map" or "someone else's map" (UX 11) — a signed-out
// visitor, and anyone looking at a tradition map, keeps the plain "make my own
// map" button pointed at the sign-up/wizard flow as before.
const isOwner = !!user && !!name && !traditionId && user.name.toLowerCase() === name.toLowerCase();
if (isOwner) {
  makeMineBtn.hidden = true;
} else if (user && name && !traditionId) {
  makeMineBtn.textContent = 'Compare with mine';
  makeMineBtn.hidden = false;
  makeMineBtn.addEventListener('click', () => {
    location.href = '/compare?name=' + encodeURIComponent(name);
  });
} else {
  makeMineBtn.hidden = false;
  makeMineBtn.addEventListener('click', () => {
    location.href = user ? '/wizard' : '/#signin';
  });
}

if (traditionId) {
  if (!tradition) {
    notFoundEl.textContent = 'No such tradition: ' + traditionId;
    notFoundEl.hidden = false;
  } else {
    try {
      const markdown = await (await fetch('/content/traditions/' + tradition.file)).text();
      const res = await fetch('/api/render', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ markdown }),
      });
      if (!res.ok) throw new Error('render failed');
      const html = await res.text();

      // The registry, not the manifest, carries the prose intro.
      let intro = '';
      try {
        const registry = await (await fetch('/content/wizard/traditions.json')).json();
        const entry = (registry.traditions || []).find(t => t.id === traditionId);
        intro = (entry && entry.map && entry.map.intro) || '';
      } catch { /* the standing line alone is enough */ }
      document.getElementById('tradition-intro').textContent = intro;
      document.getElementById('tradition-learn').href =
        '/learn?tradition=' + encodeURIComponent(traditionId);
      document.getElementById('tradition-note').hidden = false;

      frameEl.srcdoc = html;
      frameEl.hidden = false;
      fullBtn.hidden = false;
      exportBtn.hidden = false;
      exportBtn.addEventListener('click', () => {
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `theology-map-${traditionId}.html`;
        a.click();
        URL.revokeObjectURL(url);
      });
      copyBtn.hidden = false;
      copyButton(copyBtn, () =>
        new URL('/view?tradition=' + encodeURIComponent(traditionId), location.origin).href);
    } catch {
      notFoundEl.textContent = 'This tradition map could not be loaded.';
      notFoundEl.hidden = false;
    }
  }
} else if (!name) {
  notFoundEl.hidden = false;
} else {
  try {
    // Plain fetch, not apiFetch: /api/render returns text/html on success, and
    // apiFetch always calls res.json(), which silently nulls out an HTML body.
    const res = await fetch('/api/render', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name }),
    });
    const html = res.ok ? await res.text() : '';
    // The home page's "My map" tile sends a signed-in user straight here. If
    // it's their own still-empty map, land on the launchpad instead of a dead
    // "not found". Node count comes from the rendered page's own `<script
    // id="data">` payload rather than substring-matching a generated CSS class
    // (G3) — that class is markup phase 7 was explicitly licensed to change,
    // and this way emptiness tracks the actual data, not incidental HTML.
    //
    // Deliberately gated on res.ok: /api/render 404s a map that is merely
    // UNLISTED as well as one that does not exist, and the owner can unlist
    // their own map from the home page. Redirecting on any 404 would bounce them
    // to the wizard every time they clicked "My map" — an inescapable loop off
    // their own home tile. A 404 for the owner is the unlisted case; say so instead.
    const nodeCount = res.ok ? countNodes(html) : 0;
    if (isOwner && res.ok && nodeCount === 0) {
      location.replace('/wizard');
    } else if (!res.ok) {
      notFoundEl.textContent = isOwner
        ? 'Your map is unlisted, so it does not render by name. Relist it from the home page to share this link.'
        : 'Map not found.';
      notFoundEl.hidden = false;
    } else {
      const slug = slugify(name) || 'map';
      frameEl.srcdoc = html;
      frameEl.hidden = false;
      fullBtn.hidden = false;
      exportBtn.hidden = false;
      exportBtn.addEventListener('click', () => {
        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `theology-map-${slug}.html`;
        a.click();
        URL.revokeObjectURL(url);
      });

      // Never ?id= — the row id authorises a save, so a copy-link handing out an
      // id would hand out write access (phase 2, B1). ?name= is the public key.
      copyBtn.hidden = false;
      copyButton(copyBtn, () =>
        new URL('/view?name=' + encodeURIComponent(name), location.origin).href);
    }
  } catch {
    notFoundEl.hidden = false;
  }
}
</script>

</body>
</html>
